aid: biomodal
name: Biomodal
description: >-
  Biomodal (formerly Cambridge Epigenetix) is a Cambridge, UK genomics and
  epigenetics company whose duet multiomics solutions capture genetic and
  epigenetic information from a single low-input DNA sample in one experiment,
  giving researchers access to the six-base genome (the four canonical bases plus
  5-methylcytosine and 5-hydroxymethylcytosine). Its products include the duet
  multiomics solution evoC and duet +modC library-prep assays, the biomodal CLI
  and duet post-sequencing pipeline (alignment, methylation quantification, and
  variant calling), and the modality XPLR analysis software. The technology is
  applied to cancer and liquid-biopsy research, neurodegenerative disease, aging,
  precision medicine, and non-invasive prenatal testing. Biomodal is a portfolio
  company of GV (Google Ventures) and was added to the API Evangelist network as a
  life-sciences provider profile.
